<!--
  Known-GOOD validator fixture (Stage 31): the trivial single-file page —
  self-contained, static body, talks only via the ui-bridge postMessage
  JSON-RPC and signals ui/ready (nightshift-client/contracts/ui-bridge.md).
  Must pass EVERY rule in src/ui/validator.ts.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: good</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 12px; }
  h1 { font-size: 18px; }
</style>
</head>
<body>
<h1>Hello from a valid resource</h1>
<p>This static markup renders without any bridge or tool result.</p>
<script>
(() => {
  const bridged = () =>
    typeof window.ReactNativeWebView === 'object' &&
    window.ReactNativeWebView !== null &&
    typeof window.ReactNativeWebView.postMessage === 'function';
  if (bridged()) {
    window.ReactNativeWebView.postMessage(
      JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'ui/ready' }),
    );
  }
})();
</script>
</body>
</html>
